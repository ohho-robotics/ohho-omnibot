# OHH-36 — Nav2 parameters for REAL ROBOT tuning draft
# =============================================================================
# STATUS: UNVALIDATED ON HARDWARE
# Derived from omnibot_navigation/config/nav2_params.yaml and driver limits in
# omnibot_driver/config/yahboom_params.yaml (max_linear_velocity 1.0 m/s,
# max_angular_velocity 2.0 rad/s). DWB limits below match the conservative
# 0.20 m/s caps already used in simulation/navigation config — NOT confirmed
# on the physical Yahboom mecanum base.
# =============================================================================
# Human TODO before deploy:
#   - Drive figure-eight at 0.10 m/s and verify no controller oscillation.
#   - Confirm accel limits match firmware ramp (see nav2_params acc_lim_*).
#   - Replace this file path in launch only after on-robot validation.
# =============================================================================

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    controller_plugins: ["FollowPath"]
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      min_vel_x: -0.20
      min_vel_y: -0.20
      max_vel_x: 0.20
      max_vel_y: 0.20
      max_vel_theta: 1.0
      min_speed_xy: 0.0
      max_speed_xy: 0.20
      acc_lim_x: 1.0
      acc_lim_y: 1.0
      acc_lim_theta: 3.2
      decel_lim_x: -1.0
      decel_lim_y: -1.0
      decel_lim_theta: -3.2
      xy_goal_tolerance: 0.15
      trans_stopped_velocity: 0.05
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.20

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.20, 0.20, 1.0]
    min_velocity: [-0.20, -0.20, -1.0]
    max_accel: [1.0, 1.0, 3.2]
    max_decel: [-1.0, -1.0, -3.2]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
