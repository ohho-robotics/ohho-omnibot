# Topics bridged by sim.launch.py. rosbridge_websocket on port 9090 is started
# by that launch only when rosbridge:=true (the default). This file does not
# start rosbridge_server. The smoke test passes rosbridge:=false.
#
#   /cmd_vel                     geometry_msgs/msg/Twist       (ROS -> GZ, drives the base)
#   /odom                        nav_msgs/msg/Odometry
#   /scan                        sensor_msgs/msg/LaserScan
#   /imu                         sensor_msgs/msg/Imu           (GZ /imu/data)
#   /camera/front/image_raw      sensor_msgs/msg/Image
#   /camera/front/camera_info    sensor_msgs/msg/CameraInfo
#   /clock                       rosgraph_msgs/msg/Clock
#   /tf                          tf2_msgs/msg/TFMessage         (odom -> base_footprint
#                                from the gz odometry plugin; Nav2 / slam_toolbox need it)
#   /arm/sim/joint_states        sensor_msgs/msg/JointState    (GZ arm joints -> ROS)
#   /arm/sim/<joint>/cmd_pos     std_msgs/msg/Float64          (ROS -> GZ position target)
#
# /arm/joint_commands/out and /arm/joint_states stay in ROS. arm_sim_driver
# applies arm_safety and is the only node that writes the cmd_pos topics.
---
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

- ros_topic_name: "/cmd_vel"
  gz_topic_name: "/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

- ros_topic_name: "/odom"
  gz_topic_name: "/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

- ros_topic_name: "/scan"
  gz_topic_name: "/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

- ros_topic_name: "/imu"
  gz_topic_name: "/imu/data"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

- ros_topic_name: "/camera/front/image_raw"
  gz_topic_name: "/camera/front/image_raw"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/camera/front/camera_info"
  gz_topic_name: "/camera/front/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

- ros_topic_name: "/tf"
  gz_topic_name: "/tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS

# Arm joint states from gz-sim-joint-state-publisher-system (arm joints only).
- ros_topic_name: "/arm/sim/joint_states"
  gz_topic_name: "/arm/sim/joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

# One JointPositionController topic per SO-101 joint. Names match arm_params.yaml.
- ros_topic_name: "/arm/sim/arm_shoulder_pan/cmd_pos"
  gz_topic_name: "/arm/sim/arm_shoulder_pan/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/arm/sim/arm_shoulder_lift/cmd_pos"
  gz_topic_name: "/arm/sim/arm_shoulder_lift/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/arm/sim/arm_elbow_flex/cmd_pos"
  gz_topic_name: "/arm/sim/arm_elbow_flex/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/arm/sim/arm_wrist_flex/cmd_pos"
  gz_topic_name: "/arm/sim/arm_wrist_flex/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/arm/sim/arm_wrist_roll/cmd_pos"
  gz_topic_name: "/arm/sim/arm_wrist_roll/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/arm/sim/arm_gripper/cmd_pos"
  gz_topic_name: "/arm/sim/arm_gripper/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ