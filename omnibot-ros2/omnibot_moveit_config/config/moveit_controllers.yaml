# Controller names match omnibot_bringup/config/controllers.yaml.
# The arm JointTrajectoryController action is follow_joint_trajectory.
# The Jazzy gripper controller serves ParallelGripperCommand on gripper_cmd.
trajectory_execution:
  allowed_execution_duration_scaling: 2.0
  allowed_goal_duration_margin: 1.0
  allowed_start_tolerance: 0.05
  execution_duration_monitoring: true

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - arm_joint_trajectory_controller
    - gripper_controller

  arm_joint_trajectory_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - arm_shoulder_pan
      - arm_shoulder_lift
      - arm_elbow_flex
      - arm_wrist_flex
      - arm_wrist_roll

  gripper_controller:
    type: ParallelGripperCommand
    action_ns: gripper_cmd
    default: true
    max_velocity: 0.5
    allow_stalling: true
    joints:
      - arm_gripper
