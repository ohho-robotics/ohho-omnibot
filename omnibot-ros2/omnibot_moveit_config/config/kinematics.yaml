# SO-101 arm group: 5 revolute joints (shoulder pan through wrist roll).
# A 6-DOF pose (position and full orientation) is not generally reachable.
# position_only_ik solves for the tool position and leaves orientation free.
# That is the supported goal mode for Cartesian targets, including Pilz LIN.
# Joint-space goals (home, ready, OMPL, Pilz PTP) do not need this solver.
#
# Optional solver, if trac_ik_kinematics_plugin is installed:
#   kinematics_solver: trac_ik_kinematics_plugin/TRAC_IKKinematicsPlugin
# KDL is the default so the demo does not depend on TRAC-IK.
arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.1
  kinematics_solver_attempts: 3
  position_only_ik: true
