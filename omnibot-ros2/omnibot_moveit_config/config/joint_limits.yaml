# Position bounds are the tighter of omnibot_arm/config/arm_params.yaml
# (joint_min / joint_max) and the URDF <limit lower upper>.
# Velocity stays under the URDF velocity (10 rad/s) and under
# controller_manager update_rate (50 Hz) times max_joint_delta_rad (0.15),
# which is 7.5 rad/s. 1.5 rad/s is the arm cap cited in the URDF as the
# old command max. Acceleration equals that velocity, so a full-speed
# move stops in one second. The gripper velocity matches gripper_controller
# max_velocity in omnibot_bringup/config/controllers.yaml.
joint_limits:
  arm_shoulder_pan:
    has_position_limits: true
    min_position: -1.91986
    max_position: 1.91986
    has_velocity_limits: true
    max_velocity: 1.5
    has_acceleration_limits: true
    max_acceleration: 1.5
  arm_shoulder_lift:
    has_position_limits: true
    min_position: -1.57
    max_position: 1.57
    has_velocity_limits: true
    max_velocity: 1.5
    has_acceleration_limits: true
    max_acceleration: 1.5
  arm_elbow_flex:
    has_position_limits: true
    min_position: -1.57
    max_position: 1.57
    has_velocity_limits: true
    max_velocity: 1.5
    has_acceleration_limits: true
    max_acceleration: 1.5
  arm_wrist_flex:
    has_position_limits: true
    min_position: -1.57
    max_position: 1.57
    has_velocity_limits: true
    max_velocity: 1.5
    has_acceleration_limits: true
    max_acceleration: 1.5
  arm_wrist_roll:
    has_position_limits: true
    min_position: -2.74385
    max_position: 2.84121
    has_velocity_limits: true
    max_velocity: 1.5
    has_acceleration_limits: true
    max_acceleration: 1.5
  arm_gripper:
    has_position_limits: true
    min_position: -0.1
    max_position: 0.8
    has_velocity_limits: true
    max_velocity: 0.5
    has_acceleration_limits: true
    max_acceleration: 0.5
