# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-GB
tone_instructions: "Be concise, direct and constructive. Flag real bugs, security gaps and edge cases first; skip nitpicks that tooling already catches."
reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  auto_review:
    enabled: true
    drafts: true
  path_instructions:
    - path: "omnibot-ros2/**/*.py"
      instructions: |
        ROS 2 Python nodes. Check QoS choices, parameter declaration and validation, callback/thread
        safety, timer rates, and that e-stop, velocity limits and watchdog/timeout paths are correct.
    - path: "{omnibot-ros2,mecanum-kinematics}/**/*.{cpp,hpp,h}"
      instructions: |
        ROS 2 C++. Check real-time safety (no allocation/blocking in control loops), thread safety,
        RAII, numeric correctness of kinematics, and bounds on commanded velocities.
    - path: "**/launch/**"
      instructions: |
        Launch files: check arguments have sane defaults, remappings and namespaces are consistent,
        and use_sim_time is handled correctly.
    - path: "**/*.{urdf,xacro}"
      instructions: |
        URDF/xacro: check joint limits, inertias, frame names and TF tree consistency.
    - path: "omnibot-ai-{engines,ros2}/**/*.py"
      instructions: |
        ML/policy code. Check tensor shapes/devices, reproducibility, and that policy outputs are
        clamped before reaching actuators.
    - path: "omnibot-vr/Assets/**/*.cs"
      instructions: |
        Unity C# for Quest. Flag per-frame allocations, LINQ or GetComponent in Update loops, and
        network/teleop code that is not safe on disconnect.
    - path: "omnibot-android/**/*.kt"
      instructions: |
        Android/Kotlin. Check lifecycle handling, coroutine scoping, and network error handling.
    - path: "{Dockerfile.sim,docker-compose*.yml,docker/**,omnibot-digital-twin/docker/**}"
      instructions: |
        Containers: pinned base images, no secrets baked in, minimal privileges and exposed ports.
    - path: ".github/workflows/**"
      instructions: |
        Check actions are pinned (ideally to a commit SHA), permissions follow least privilege,
        secrets are never echoed or exposed to untrusted PR code, and caching/matrix logic is correct.
    - path: "**/*.md"
      instructions: |
        Check docs stay accurate against the code (commands, paths, flags). Flag unverifiable claims.
