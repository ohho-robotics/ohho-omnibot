smolvla_node:
  ros__parameters:
    checkpoint_path: "lerobot/smolvla_base"
    device: "cuda"
    policy_hz: 10.0
    chunk_size: 50
    state_dim: 9
    action_dim: 9
    image_width: 320
    image_height: 240
    task_description: "pick up the object and place it in the bin"
    base_vel_scale: 0.3
    # Max joint-target change per accepted command (same 0.15 rad limit as arm driver)
    max_joint_delta_rad: 0.15
    # Joint angle limits (matching arm driver)
    joint_min: [-3.14, -1.57, -1.57, -1.57, -3.14, -0.1]
    joint_max: [3.14, 1.57, 1.57, 1.57, 3.14, 0.8]
    # TensorRT acceleration (Phase 1 — vision encoder only)
    # Set use_trt: true and point trt_engine_path at the pre-built engine.
    # Build the engine once with:
    #   python -m vla_engine.trt.build_engine \
    #       --checkpoint lerobot/smolvla_base \
    #       --output /path/to/engines/smolvla_vision_fp16.trt \
    #       --precision fp16
    use_trt: false
    trt_engine_path: ""

teleop_recorder_node:
  ros__parameters:
    output_dir: "~/datasets/mobile_manipulation"
    repo_id: "local/mobile_manipulation"
    record_hz: 30.0
    episode_timeout_s: 60.0
    joy_record_button: 7
    joy_discard_button: 6
    action_source: "leader"   # leader | vr
    operator: ""
    robot_kind: "sim"         # sim | real
    sim_world: ""
    vr_action_prefer: "teleop"
    vr_arm_command_topic: "/arm/joint_commands/teleop"
    vr_arm_mux_topic: "/arm/joint_commands/out"
    vr_base_command_topic: "/cmd_vel/teleop"
    vr_base_mux_topic: "/cmd_vel/out"
    control_mode_topic: "/control_mode"
