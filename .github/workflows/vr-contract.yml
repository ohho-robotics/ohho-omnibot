name: vr-contract

# Scripted headset against the Gazebo VR profile. No robot and no Quest.
# PR and push to main, plus a nightly run. The job fails if Gazebo is no
# longer driven from the cmd_vel mux output.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

concurrency:
  group: vr-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vr-contract:
    name: vr-contract (scripted headset)
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base-noble
    timeout-minutes: 60
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      GALLIUM_DRIVER: llvmpipe
      QT_QPA_PLATFORM: offscreen
      MESA_GL_VERSION_OVERRIDE: "3.3"
    steps:
      - name: Install git and sudo
        run: apt-get update && apt-get install -y git sudo ca-certificates
      - uses: actions/checkout@v4
      - name: Install Gazebo Harmonic, rosbridge, and software rendering
        shell: bash
        run: |
          set -eo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            python3-colcon-common-extensions \
            python3-rosdep \
            python3-pytest \
            python3-pip \
            libgl1-mesa-dri \
            libegl1 \
            libegl-mesa0 \
            libglx-mesa0 \
            libglu1-mesa \
            xvfb
          sudo rosdep init || true
          rosdep update
          source /opt/ros/jazzy/setup.bash
          # web_video_server is not started (video:=false). The contract
          # does not need MJPEG, and the package is optional in this image.
          rosdep install --from-paths src --ignore-src -y --rosdistro jazzy \
            --dependency-types=build \
            --dependency-types=buildtool \
            --dependency-types=build_export \
            --dependency-types=buildtool_export \
            --dependency-types=exec \
            --dependency-types=test \
            --skip-keys "web_video_server"
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            ros-jazzy-rosbag2-storage-mcap
          python3 -m pip install --break-system-packages "websockets>=13"
      - name: Build the VR profile
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install --base-paths src \
            --packages-up-to omnibot_bringup
      - name: Run the scripted headset
        shell: bash
        run: |
          set -eo pipefail
          bash tests/vr_contract/run_vr_contract.sh vr-contract-out
      - name: Upload logs and MCAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vr-contract-logs
          path: vr-contract-out/
          if-no-files-found: warn
