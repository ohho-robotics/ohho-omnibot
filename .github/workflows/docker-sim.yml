name: Docker Sim

on:
  pull_request:
    paths:
      - "Dockerfile.sim"
      - "docker-compose*.yml"
      - ".devcontainer/**"
      - "omnibot-digital-twin/docker/**"
      - ".github/workflows/docker-sim.yml"
      - "omnibot-ros2/**"
      - "src/**"
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "Dockerfile.sim"
      - "docker-compose*.yml"
      - ".devcontainer/**"
      - "omnibot-digital-twin/docker/**"
      - ".github/workflows/docker-sim.yml"
      - "omnibot-ros2/**"
      - "src/**"
  workflow_dispatch:

concurrency:
  group: docker-sim-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  docker-sim:
    name: Build, smoke test and publish sim container
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/omnibot-sim
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.sim
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          load: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
          tags: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && steps.meta.outputs.tags || 'omnibot-sim:test' }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker compose configuration check
        run: |
          docker compose config
          docker compose -f omnibot-digital-twin/docker/docker-compose.yml config
          docker compose -f docker-compose.gpu.yml config
          docker compose -f omnibot-digital-twin/docker/docker-compose.gpu.yml config

      - name: Smoke test container
        shell: bash
        run: |
          IMAGE_NAME="${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && format('ghcr.io/{0}/omnibot-sim:latest', github.repository_owner) || 'omnibot-sim:test' }}"
          if [[ "${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}" == "true" ]]; then
            docker pull "${IMAGE_NAME}"
          fi
          docker run --rm -i "${IMAGE_NAME}" bash -s <<'SMOKE'
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          source /opt/omnibot/install/setup.bash
          echo '=== Checking ROS 2 packages ==='
          ros2 pkg list | grep -E 'omnibot_navigation|omnibot_bringup|omnibot_description|mecanum_drive_ros2'
          echo '=== Checking launch description ==='
          ros2 launch omnibot_navigation sim_navigation.launch.py --show-args
          ros2 launch omnibot_bringup sim_vr.launch.py --show-args
          echo '=== Checking python imports ==='
          python3 -c "import mecanum_drive_ros2; import yahboom_ros2; import learning_engine; import agent_engine; print('Imports OK')"
          SMOKE
