title = "OmniBot"

[extend]
useDefault = true

# These Meta XR SDK lines match generic-api-key and are not credentials.
# BlockDataIds.cs is a list of Unity building-block GUIDs.
# AvatarEntity.cs aliases Oculus.Avatar2.CAPI.
# VoiceSetupController.cs ships Meta's documented public Wit.ai demo
# client token (the file says it is a public demo key).
[[allowlists]]
description = "Meta XR SDK false positives and the published Wit.ai demo token"
paths = [
  '''omnibot-vr/Packages/com\.meta\.xr\.sdk\.core/Editor/BuildingBlocks/BlockDataIds\.cs''',
  '''omnibot-vr/Packages/com\.meta\.xr\.sdk\.core/Scripts/BuildingBlocks/MultiplayerBlocks/Shared/NetworkedAvatar/Scripts/AvatarEntity\.cs''',
  '''omnibot-vr/Packages/com\.meta\.xr\.sdk\.core/Scripts/ImmersiveDebugger/DevAgent/Voice/VoiceSetupController\.cs''',
]

# Public values, not credentials:
# - The Supabase anon key in vr_manifest.json is the project's publishable key
#   (role "anon"; access is enforced by row-level security). It ships in every client.
# - dGhlIHNhbXBsZSBub25jZQ== is the RFC 6455 sample Sec-WebSocket-Key (ohho-webrtc wsproto tests).
[[allowlists]]
description = "Supabase anon (publishable) key and RFC 6455 sample nonce"
regexTarget = "match"
regexes = [
  '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVjbnl1YXBwZ3RjcG9scWRhb3Z2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3MjU5NTEsImV4cCI6MjA5NzMwMTk1MX0.Cf3g2nxHtaeGU59UwtCdpuNwQV6cCZ4yvdBSqhAEtls''',
  '''dGhlIHNhbXBsZSBub25jZQ==''',
]
