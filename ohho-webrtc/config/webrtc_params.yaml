# OHH-210. Chase is the name OHH-200 is expected to publish. It is not on main
# yet. Override track_topics when a camera uses a different image topic.
# B-frames stay off; the node rejects bframes other than 0.
ohho_webrtc:
  ros__parameters:
    track_names: [chase, front, wrist]
    track_topics:
      - /camera/chase/image_raw
      - /camera/front/image_raw
      - /camera/wrist/image_raw
    signaling_host: 127.0.0.1
    signaling_port: 8766
    stun_urls:
      - stun:stun.l.google.com:19302
    turn_urls: []
    turn_username: ""
    turn_credential: ""
    width: 1280
    height: 720
    fps: 30
    bitrate_bps: 3000000
    gop: 15
    encoder: auto
    test_pattern: false
